name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: snok/install-poetry@v1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Run unit tests
        run: make test
      - name: Type-check with mypy
        run: make typecheck
      - name: Run Jupyter notebooks
        run: |
          echo -e "from pathlib import Path\ntest_bids_read_path=Path('$PWD/tests/data/bids')\ntest_bids_write_path=Path('/tmp/gen_bids_clinicaio/')" > notebooks/_env.py
          make run-notebooks