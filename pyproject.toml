[project]
name = "clinicaio"
version = "0.2.0"
description = "A Python library for input/output management of all Clinica projects."
license = "MIT"
authors = [
    { name = "ARAMIS Lab" }
]
maintainers = [
    { name = "Clinica developers", email = "clinica.run@gmail.com>"},
]
readme = "README.md"
packages = [{include = "clinicaio", from = "src"}]
keywords = [
    "bids",
    "image processing",
    "machine learning",
    "neuroimaging",
    "neuroscience"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing"
]
# ClinicaIO adopts the same Python version policy as Clinica itself, so the dependencies are
# also impacted by it.
# See https://scientific-python.org/specs/spec-0000/
requires-python = ">=3.10,<=3.14"
dependencies = [
    "pandas",
    #"nbsphinx",
    "packaging",
]

[project.urls]
sources = "https://github.com/aramis-lab/clinicaio.git"

[tool.poetry.group.dev.dependencies]
pytest = "*"
notebook = "*"
pyfakefs = "*"


[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-autoapi = "*"
myst-nb = "*"
sphinx-book-theme = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "I001",
    # "PTH",
]
ignore = ["E203", "E501", "E721"]

[tool.ruff.lint.isort]
known-first-party = ["clinicaio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mutmut]
#source_paths = [ "src/" ]
pytest_add_cli_args_test_selection= [ "tests/unittests" ]
#debug = true